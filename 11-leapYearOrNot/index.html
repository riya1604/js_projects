<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Leap Year Or Not</title>
</head>
<body>

  <div class="main">
    <div class="container">
      <h1>Leap Year Or Not??</h1>
      <input type="text" placeholder="Type the year" class="js-input" onkeydown="
      if(event.key == 'Enter'){
        checkLeapYear();
      }
      ">
      <button class="js-btn">Submit</button>
      <p class="js-text"></p>
    </div>
  </div>

  <script src="script.js"></script>
  
</body>
</html>
